<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#1e6fe0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Arm Jog">
  <title>Robot Arm Jog</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="title">
      <img src="icons/icon-192.png" alt="" class="logo">
      <div>
        <h1>Robot Arm Jog</h1>
        <p class="sub" id="modeText">Not connected</p>
      </div>
    </div>
    <div class="pills">
      <span class="pill" id="pillBroker"><i></i>Cloud</span>
      <span class="pill" id="pillDevice"><i></i>Arm</span>
    </div>
  </header>

  <main>
    <p class="note">Hold a button to rotate the motor. Release to stop.<br>Motors stay <b>OFF</b> (no signal) until you press them.</p>

    <section class="card" id="motors"></section>

    <section class="card">
      <h2>Jog Speed</h2>
      <div class="seg" id="speedSeg">
        <button type="button" data-v="70">Slow</button>
        <button type="button" data-v="160" class="on">Medium</button>
        <button type="button" data-v="300">Fast</button>
      </div>
    </section>

    <button class="btn estop" id="btnStop" type="button">Emergency Stop (all motors)</button>
    <button class="btn ghost" id="btnZero" type="button">Reset Travel Counters to 0</button>

    <details class="card" id="settings">
      <summary>Connection Settings</summary>
      <label class="field">Device ID (must match DEVICE_ID in the ESP32 sketch)
        <input id="deviceId" type="text" autocomplete="off" autocapitalize="off" spellcheck="false">
      </label>
      <label class="field">MQTT WebSocket URL
        <input id="brokerUrl" type="text" autocomplete="off" autocapitalize="off" spellcheck="false">
      </label>
      <button class="btn primary" id="btnConnect" type="button">Save &amp; Reconnect</button>
      <p class="hint" id="topicHint"></p>
    </details>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="mqtt.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
