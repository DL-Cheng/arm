<text x="1120" y="798" font-size="16" font-weight="700" text-anchor="middle" fill="#b86600">外部電源 6 V / ≥5 A</text>
<text x="1120" y="820" font-size="12" text-anchor="middle" fill="#b86600">(+) 接 V+ 匯流　(−) 接 GND 匯流</text>
