<circle cx="1130" cy="770" r="7" fill="#e5484d"/><circle cx="1175" cy="770" r="7" fill="#222"/>
<circle cx="1000" cy="800" r="6" fill="#222"/>
<rect x="40" y="880" width="1200" height="130" rx="14" fill="#fff6f6" stroke="#e5484d" stroke-width="2"/>
<text x="60" y="910" font-size="16" font-weight="700" fill="#e5484d">注意事項</text>
<text x="60" y="936" font-size="14" fill="#44566e">1. 6 顆馬達的紅線只接外部電源，絕對不可接 ESP32 的 3V3 / 5V / VIN；ESP32 由 USB 另外供電。</text>
<text x="60" y="956" font-size="14" fill="#44566e">2. 外部電源 GND 必須與 ESP32 GND 相連（共地），否則訊號無參考位準、馬達亂跳。</text>
<text x="60" y="976" font-size="14" fill="#44566e">3. 電源端並聯 1000~2200 µF 電容，並建議先降低速度測試；堵轉時單顆最高約 2.5 A。</text>
<text x="60" y="996" font-size="14" fill="#44566e">4. 訊號線為 3.3 V 準位，MG996R 可直接驅動；若抖動可在每條訊號線串聯 220 Ω 電阻。</text>
</svg>